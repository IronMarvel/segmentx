[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentx"
version = "1.0.0"
description = "Multi-method image segmentation and object extraction toolkit"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
